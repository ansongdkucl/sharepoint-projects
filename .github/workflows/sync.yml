name: Aruba Port Sync (Self-Hosted)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

defaults:
  run:
    shell: powershell

jobs:
  run-sync:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install netmiko openpyxl python-dotenv requests pywin32

      - name: Show working directory
        run: |
          $PSVersionTable.PSVersion
          Get-Location
          Get-ChildItem -Force

      - name: Execute Port Sync Script
        env:
          username: ${{ secrets.username }}
          passwordAD: ${{ secrets.passwordAD }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          WORKBOOK_PATH: 'C:\Users\cceadan\University College London\ISD.ITSD.CO.Technical Specialists - patching\FC-MSA-CI.xlsx'
        run: python config-ports-sync-greg.py

      - name: Upload debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-debug
          path: |
            session_debug.txt
            *.log
          if-no-files-found: ignore
